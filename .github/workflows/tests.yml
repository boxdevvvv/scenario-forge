name: Tests

# Manual only: runs when started from the Actions tab ("Run workflow").
# It needs the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets.
# Tests are normally run locally in the Unity Editor before pushing.
on:
  workflow_dispatch:

jobs:
  test:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.8f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results
          artifactsPath: TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
